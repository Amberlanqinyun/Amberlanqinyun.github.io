<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Week one to every month</title><desc id="d">The three steps drawn to length on one baseline. Read and Install sit inside a short finite segment marked once, in week one. Run sits on an amber segment marked every month from then on, which runs off the right edge because the work does not end.</desc>
<defs>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
    <feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="1600" height="900" fill="#0E0E0D"/>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.028"/>
<text x="96" y="156" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="500" letter-spacing="0.2em" text-transform="uppercase" fill="#FAF8F3" fill-opacity="0.54" text-anchor="start">HOW IT WORKS</text>
<text x="96" y="274" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="76" font-weight="600" letter-spacing="-0.03em" fill="#FAF8F3" fill-opacity="1.0" text-anchor="start">Week one to</text>
<text x="96" y="358" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="76" font-weight="600" letter-spacing="-0.03em" fill="#FAF8F3" fill-opacity="0.38" text-anchor="start">every month.</text>
<text x="96" y="428" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="300" letter-spacing="0em" fill="#FAF8F3" fill-opacity="0.72" text-anchor="start">Two steps happen once. The third never stops.</text>
<path d="M 96 640 L 720 640" stroke="#FAF8F3" stroke-opacity="0.2"/>
<path d="M 720 640 L 1504 640" stroke="#E4A43C" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
<text x="96" y="536" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="500" letter-spacing="0.2em" text-transform="uppercase" fill="#FAF8F3" fill-opacity="0.38" text-anchor="start">ONCE, IN WEEK ONE</text>
<text x="720" y="536" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="500" letter-spacing="0.2em" text-transform="uppercase" fill="#FAF8F3" fill-opacity="0.38" text-anchor="start">EVERY MONTH, FROM THEN ON</text>
<path d="M 96 554 L 96 582" stroke="#FAF8F3" stroke-opacity="0.14"/>
<path d="M 720 554 L 720 582" stroke="#FAF8F3" stroke-opacity="0.14"/>
<circle cx="240" cy="640" r="7" fill="#FAF8F3" fill-opacity="0.34"/>
<path d="M 240 594 L 240 626" stroke="#FAF8F3" stroke-opacity="0.17"/>
<text x="240" y="578" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="500" letter-spacing="0.16em" fill="#FAF8F3" fill-opacity="0.54" text-anchor="start">01</text>
<text x="240" y="718" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="600" letter-spacing="-0.02em" fill="#FAF8F3" fill-opacity="1.0" text-anchor="start">Read</text>
<circle cx="480" cy="640" r="7" fill="#FAF8F3" fill-opacity="0.34"/>
<path d="M 480 594 L 480 626" stroke="#FAF8F3" stroke-opacity="0.17"/>
<text x="480" y="578" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="500" letter-spacing="0.16em" fill="#FAF8F3" fill-opacity="0.54" text-anchor="start">02</text>
<text x="480" y="718" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="600" letter-spacing="-0.02em" fill="#FAF8F3" fill-opacity="1.0" text-anchor="start">Install</text>
<circle cx="860" cy="640" r="7" fill="#E4A43C" fill-opacity="1.0"/>
<path d="M 860 594 L 860 626" stroke="#E4A43C" stroke-opacity="0.5"/>
<text x="860" y="578" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="500" letter-spacing="0.16em" fill="#FAF8F3" fill-opacity="0.54" text-anchor="start">03</text>
<text x="860" y="718" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="600" letter-spacing="-0.02em" fill="#FAF8F3" fill-opacity="1.0" text-anchor="start">Run</text>
</svg>