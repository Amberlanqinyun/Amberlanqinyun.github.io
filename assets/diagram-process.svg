<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Read. Install. Run.</title><desc id="d">The three steps of a Flow AI engagement on a single baseline.</desc>
<defs>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
    <feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="1600" height="900" fill="#0E0E0D"/>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.028"/>
<text x="96" y="156" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="500" letter-spacing="0.2em" text-transform="uppercase" fill="#FAF8F3" fill-opacity="0.54" text-anchor="start">HOW IT WORKS</text>
<text x="96" y="274" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="76" font-weight="600" letter-spacing="-0.03em" fill="#FAF8F3" fill-opacity="1.0" text-anchor="start">Read. Install. Run.</text>
<text x="96" y="336" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="300" letter-spacing="0em" fill="#FAF8F3" fill-opacity="0.72" text-anchor="start">A human reviews everything before it ships.</text>
<path d="M 96 600 L 1504 600" stroke="#FAF8F3" stroke-opacity="0.2"/>
<circle cx="96" cy="600" r="7" fill="#E4A43C" fill-opacity="1.0"/>
<path d="M 96 548 L 96 586" stroke="#E4A43C" stroke-opacity="0.6"/>
<text x="96" y="532" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="500" letter-spacing="0.16em" fill="#FAF8F3" fill-opacity="0.54" text-anchor="start">01</text>
<text x="96" y="676" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="600" letter-spacing="-0.02em" fill="#FAF8F3" fill-opacity="1.0" text-anchor="start">Read</text>
<text x="96" y="726" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="300" letter-spacing="0em" fill="#FAF8F3" fill-opacity="0.66" text-anchor="start">Tell Flow what you sell and who</text>
<text x="96" y="758" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="300" letter-spacing="0em" fill="#FAF8F3" fill-opacity="0.66" text-anchor="start">buys it. A written read of your</text>
<text x="96" y="790" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="300" letter-spacing="0em" fill="#FAF8F3" fill-opacity="0.66" text-anchor="start">marketing, ranked, in week one.</text>
<circle cx="566" cy="600" r="7" fill="#FAF8F3" fill-opacity="0.34"/>
<path d="M 566 548 L 566 586" stroke="#FAF8F3" stroke-opacity="0.20400000000000001"/>
<text x="566" y="532" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="500" letter-spacing="0.16em" fill="#FAF8F3" fill-opacity="0.54" text-anchor="start">02</text>
<text x="566" y="676" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="600" letter-spacing="-0.02em" fill="#FAF8F3" fill-opacity="1.0" text-anchor="start">Install</text>
<text x="566" y="726" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="300" letter-spacing="0em" fill="#FAF8F3" fill-opacity="0.66" text-anchor="start">Pick the system with the most to</text>
<text x="566" y="758" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="300" letter-spacing="0em" fill="#FAF8F3" fill-opacity="0.66" text-anchor="start">gain. It goes live with the assets,</text>
<text x="566" y="790" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="300" letter-spacing="0em" fill="#FAF8F3" fill-opacity="0.66" text-anchor="start">automation and tracking it needs.</text>
<circle cx="1036" cy="600" r="7" fill="#FAF8F3" fill-opacity="0.34"/>
<path d="M 1036 548 L 1036 586" stroke="#FAF8F3" stroke-opacity="0.20400000000000001"/>
<text x="1036" y="532" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="500" letter-spacing="0.16em" fill="#FAF8F3" fill-opacity="0.54" text-anchor="start">03</text>
<text x="1036" y="676" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="600" letter-spacing="-0.02em" fill="#FAF8F3" fill-opacity="1.0" text-anchor="start">Run</text>
<text x="1036" y="726" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="300" letter-spacing="0em" fill="#FAF8F3" fill-opacity="0.66" text-anchor="start">Flow runs it every month. A human</text>
<text x="1036" y="758" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="300" letter-spacing="0em" fill="#FAF8F3" fill-opacity="0.66" text-anchor="start">reviews the output, and one short</text>
<text x="1036" y="790" font-family="'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="300" letter-spacing="0em" fill="#FAF8F3" fill-opacity="0.66" text-anchor="start">report says what shipped.</text>
</svg>